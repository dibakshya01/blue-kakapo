[project]
name = "blue-kakapo"
version = "0.0.1"
description = "Open-source, self-hostable, agentic SOC platform for trustworthy Tier-1 triage — a transparent coworker for L2/L3 analysts."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "blue-kakapo contributors" }]
keywords = ["soc", "security", "agentic", "ai", "triage", "siem", "edr", "ocsf", "self-hosted"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Information Technology",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Security",
]
dependencies = [
  "pydantic>=2.7",
  "pydantic-settings>=2.2",
  "fastapi>=0.111",
  "uvicorn[standard]>=0.30",
  "httpx>=0.27",
  "structlog>=24.1",
  "numpy>=1.26",
  "typing-extensions>=4.11",
  "sqlalchemy>=2.0",      # one DB layer for SQLite (dev) and Postgres (prod)
  "cryptography>=42.0",   # per-record AES-GCM crypto-shredding for GDPR-respecting erasure
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1", "pgvector>=0.3"]
otel = [
  "opentelemetry-api>=1.25",
  "opentelemetry-sdk>=1.25",
]
dev = [
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
  "hypothesis>=6.100",
  "ruff>=0.5",
  "mypy>=1.10",
  "respx>=0.21",
]

[project.scripts]
blue-kakapo = "blue_kakapo.cli:main"
bk = "blue_kakapo.cli:main"

[project.urls]
Homepage = "https://github.com/dibakshya01/blue-kakapo"
Repository = "https://github.com/dibakshya01/blue-kakapo"
Issues = "https://github.com/dibakshya01/blue-kakapo/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/blue_kakapo"]

[tool.uv]
# Keep dev tooling resolvable with `uv run`.
dev-dependencies = [
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
  "hypothesis>=6.100",
  "ruff>=0.5",
  "mypy>=1.10",
  "respx>=0.21",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC", "S"]
# S101: assert in tests is fine; handled per-file below.
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S311"]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true
files = ["src/blue_kakapo"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"
