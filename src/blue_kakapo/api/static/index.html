<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>blue-kakapo</title>
<style>
  :root {
    --bg:#0b0f14; --panel:#121821; --panel2:#0e141c; --line:#1e2730;
    --text:#e6edf3; --muted:#8893a0; --green:#3ddc97; --blue:#4aa8ff; --amber:#ffb454; --red:#ff5c5c;
    --mono:"SFMono-Regular",ui-monospace,"JetBrains Mono",Menlo,Consolas,monospace;
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:14px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif; }
  header { padding:18px 22px; border-bottom:1px solid var(--line); display:flex; align-items:center; gap:12px; }
  header h1 { font-size:18px; margin:0; letter-spacing:.3px; }
  header .tag { font-family:var(--mono); font-size:11px; color:var(--muted); border:1px solid var(--line); padding:2px 8px; border-radius:6px; }
  .dot { width:9px; height:9px; border-radius:50%; background:var(--green); box-shadow:0 0 8px var(--green); }
  main { display:grid; grid-template-columns:minmax(300px,1fr) minmax(360px,1.4fr); gap:16px; padding:16px 22px; max-width:1200px; }
  @media (max-width:820px){ main{ grid-template-columns:1fr; } }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:16px; }
  h2 { font-size:12px; text-transform:uppercase; letter-spacing:1px; color:var(--muted); margin:0 0 12px; font-family:var(--mono); }
  textarea { width:100%; height:150px; background:var(--panel2); color:var(--text); border:1px solid var(--line); border-radius:8px; padding:10px; font-family:var(--mono); font-size:12px; resize:vertical; }
  button { background:var(--blue); color:#04121f; border:0; border-radius:8px; padding:9px 14px; font-weight:600; cursor:pointer; }
  button.ghost { background:transparent; color:var(--muted); border:1px solid var(--line); font-weight:500; }
  button:hover { filter:brightness(1.08); }
  .row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-top:10px; }
  .caselist { display:flex; flex-direction:column; gap:8px; max-height:60vh; overflow:auto; }
  .case { background:var(--panel2); border:1px solid var(--line); border-radius:9px; padding:10px 12px; cursor:pointer; display:flex; justify-content:space-between; gap:10px; align-items:center; }
  .case:hover { border-color:#30404f; }
  .case .t { font-weight:600; font-size:13px; }
  .case .m { color:var(--muted); font-size:11px; font-family:var(--mono); }
  .badge { font-family:var(--mono); font-size:10.5px; padding:3px 8px; border-radius:20px; border:1px solid; white-space:nowrap; }
  .b-green { color:var(--green); border-color:var(--green); }
  .b-amber { color:var(--amber); border-color:var(--amber); }
  .b-red { color:var(--red); border-color:var(--red); }
  .b-blue { color:var(--blue); border-color:var(--blue); }
  .verdict { font-size:22px; font-weight:700; margin:2px 0 4px; }
  .conf { font-family:var(--mono); color:var(--muted); font-size:12px; }
  .ev { border-left:2px solid var(--line); padding:6px 0 6px 12px; margin:8px 0; }
  .ev .src { font-family:var(--mono); font-size:10.5px; color:var(--blue); }
  .ledger { font-family:var(--mono); font-size:11.5px; color:var(--muted); }
  .ledger .ok { color:var(--green); }
  .muted { color:var(--muted); }
  a { color:var(--blue); }
  .empty { color:var(--muted); font-size:13px; padding:12px 0; }
</style>
</head>
<body>
<header>
  <span class="dot" id="statusdot"></span>
  <h1>🦜 blue-kakapo</h1>
  <span class="tag" id="providertag">provider: …</span>
  <span class="tag">Tier-1 triage · coworker</span>
</header>

<main>
  <section>
    <div class="card">
      <h2>Triage an alert</h2>
      <textarea id="alert" spellcheck="false"></textarea>
      <div class="row">
        <button id="go">Triage</button>
        <button class="ghost" data-sample="malicious">sample: malicious</button>
        <button class="ghost" data-sample="benign">sample: benign</button>
        <button class="ghost" data-sample="suspicious">sample: suspicious</button>
      </div>
    </div>
    <div class="card" style="margin-top:16px;">
      <h2>Cases</h2>
      <div class="caselist" id="cases"><div class="empty">No cases yet — triage an alert above.</div></div>
    </div>
  </section>

  <section>
    <div class="card" id="detailcard">
      <h2>Case detail</h2>
      <div id="detail"><div class="empty">Select or triage a case to see its verdict, evidence, and the replayable ledger.</div></div>
    </div>
  </section>
</main>

<script>
const SAMPLES = {
  malicious: { title:"Outbound connection to known C2", severity:"high", rule_name:"C2 beacon detected",
    src_ip:"10.0.0.14", dst_ip:"198.51.100.23", user:"svc-web", attack_techniques:["T1071"],
    message:"Host contacted malware.example over HTTPS", domain:"malware.example" },
  benign: { title:"Scheduled backup login", severity:"low", rule_name:"Successful login (test)",
    src_ip:"10.0.0.9", user:"backup-svc", message:"Routine scheduled backup job authenticated",
    domain:"internal.example" },
  suspicious: { title:"PowerShell with encoded command", severity:"medium", rule_name:"Suspicious PowerShell exploit",
    host:"WS-204", user:"jdoe", message:"Possible credential access via encoded PowerShell" },
};
const badgeClass = v => ({benign:"b-green",false_positive:"b-green",suspicious:"b-amber",inconclusive:"b-amber",malicious:"b-red"}[v]||"b-blue");
const routeClass = r => ({auto_close:"b-green",escalate:"b-amber",await_approval:"b-blue"}[r]||"b-blue");
const esc = s => String(s).replace(/[&<>]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));

async function j(url, opts){ const r = await fetch(url, opts); if(!r.ok) throw new Error(await r.text()); return r.json(); }

async function loadProvider(){
  try { const p = await j("/api/provider");
    document.getElementById("providertag").textContent = `provider: ${p.provider}${p.offline?" (offline)":""}`;
  } catch(e){ document.getElementById("statusdot").style.background="var(--red)"; }
}

async function loadCases(){
  const cases = await j("/api/cases");
  const el = document.getElementById("cases");
  if(!cases.length){ el.innerHTML = '<div class="empty">No cases yet — triage an alert above.</div>'; return; }
  el.innerHTML = "";
  for(const c of cases){
    const v = c.verdict || {};
    const d = document.createElement("div"); d.className="case";
    d.innerHTML = `<div><div class="t">${esc(c.title)}</div><div class="m">${esc(c.id)} · ${esc(c.state)}</div></div>
      <span class="badge ${badgeClass(v.verdict_class)}">${esc(v.verdict_class||"—")}</span>`;
    d.onclick = ()=>showDetail(c.id);
    el.appendChild(d);
  }
}

async function showDetail(id){
  const c = await j(`/api/cases/${id}`);
  const v = c.verdict || {};
  const led = await j(`/api/cases/${id}/ledger`);
  const ev = (c.evidence||[]).map(e=>`<div class="ev"><span class="src">${esc(e.source)}</span> — ${esc(e.summary)}</div>`).join("") || '<div class="muted">No evidence.</div>';
  const steps = (led.entries||[]).map(e=>`<div>#${e.seq} · ${esc(e.action)}</div>`).join("");
  document.getElementById("detail").innerHTML = `
    <div class="verdict">${esc(v.verdict_class||"—")}
      <span class="badge ${routeClass(v.routing)}" style="vertical-align:middle;margin-left:6px;">${esc(v.routing||"")}</span></div>
    <div class="conf">confidence ${v.confidence!=null?(v.confidence*100).toFixed(0)+"%":"—"} · by ${esc(v.produced_by||"L1")} · model ${esc(v.model_id||"—")}</div>
    <p>${esc(v.rationale||"")}</p>
    <h2 style="margin-top:16px;">Evidence</h2>${ev}
    <h2 style="margin-top:16px;">Ledger trail <span class="ledger ok">${led.verified?"chain verified ✓":"⚠ unverified"}</span></h2>
    <div class="ledger">${steps}</div>`;
}

async function triage(){
  let alert; try { alert = JSON.parse(document.getElementById("alert").value); }
  catch(e){ alert = { message: document.getElementById("alert").value, title:"Free-text alert" }; }
  const btn = document.getElementById("go"); btn.textContent="Triaging…"; btn.disabled=true;
  try { const res = await j("/api/ingest", {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({alert})});
    await loadCases(); await showDetail(res.case.id);
  } catch(e){ alert && console.error(e); document.getElementById("detail").innerHTML = `<div class="empty">Error: ${esc(e.message)}</div>`; }
  finally { btn.textContent="Triage"; btn.disabled=false; }
}

document.getElementById("go").onclick = triage;
document.querySelectorAll("[data-sample]").forEach(b=> b.onclick = ()=>{
  document.getElementById("alert").value = JSON.stringify(SAMPLES[b.dataset.sample], null, 2);
});
document.getElementById("alert").value = JSON.stringify(SAMPLES.malicious, null, 2);
loadProvider(); loadCases();
</script>
</body>
</html>
